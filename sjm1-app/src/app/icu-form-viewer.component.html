<div class="icu-form-viewer">
  <!-- 工具栏 -->
  <div class="viewer-toolbar">
    <div class="toolbar-controls">
      <label class="toolbar-label" for="form-select">表单</label>
      <select
        id="form-select"
        class="toolbar-select"
        [(ngModel)]="selectedFormKey"
        (ngModelChange)="onFormChange()">
        <option *ngFor="let f of forms" [value]="f.key">{{ f.title }}</option>
      </select>

      <label class="toolbar-label" for="mrn-input">住院号</label>
      <input
        id="mrn-input"
        class="toolbar-input"
        type="text"
        placeholder="请输入住院号"
        [(ngModel)]="mrnInput"
        (keyup.enter)="onQuery()"
        aria-label="住院号" />

      <ng-container *ngIf="needTimeRange">
        <label class="toolbar-label" for="start-time">开始时间</label>
        <input
          id="start-time"
          class="toolbar-input toolbar-date"
          type="date"
          [(ngModel)]="startDate"
          aria-label="开始时间" />

        <label class="toolbar-label" for="end-time">结束时间</label>
        <input
          id="end-time"
          class="toolbar-input toolbar-date"
          type="date"
          [(ngModel)]="endDate"
          aria-label="结束时间" />
      </ng-container>

      <button class="toolbar-query-btn" (click)="onQuery()" [disabled]="state === 'loading-patient'">
        查询
      </button>
    </div>

    <div class="toolbar-patient-info" *ngIf="patientInfo">
      {{ patientInfo }}
    </div>
  </div>

  <!-- 内容区 -->
  <div class="viewer-content">
    <!-- 加载中 -->
    <div class="state-panel" *ngIf="state === 'loading-patient'">
      <div class="state-spinner"></div>
      <div>正在查询患者信息...</div>
    </div>

    <!-- 空状态 -->
    <div class="state-panel" *ngIf="state === 'idle'">
      <div class="state-icon">📋</div>
      <div class="state-text">请输入住院号后点击查询</div>
    </div>

    <!-- 错误状态 -->
    <div class="state-panel state-error" *ngIf="state === 'error'">
      <div class="state-icon">⚠️</div>
      <div class="state-text">{{ errorMessage }}</div>
    </div>

    <!-- 患者不存在 -->
    <div class="state-panel state-error" *ngIf="state === 'patient-not-found'">
      <div class="state-icon">❌</div>
      <div class="state-text">{{ errorMessage }}</div>
    </div>

    <!-- 直接渲染子表单组件 -->
    <div *ngIf="state === 'ready' && patient" class="form-container">
      <app-hljld-form-pdf-new *ngIf="selectedFormKey === 'hljldFormPDFNew'" [class.viewer-mode]="isViewerMode"></app-hljld-form-pdf-new>
      <app-handover-report *ngIf="selectedFormKey === 'handoverReport'" [class.viewer-mode]="isViewerMode"></app-handover-report>
      <app-ydwzl-temperature *ngIf="selectedFormKey === 'ydwzlForm'" [class.viewer-mode]="isViewerMode"></app-ydwzl-temperature>
      <app-ecmo-record *ngIf="selectedFormKey === 'ecmoForm'" [class.viewer-mode]="isViewerMode"></app-ecmo-record>
      <app-crrt-record *ngIf="selectedFormKey === 'crrtForm'" [class.viewer-mode]="isViewerMode"></app-crrt-record>
      <app-crrt-order-form *ngIf="selectedFormKey === 'crrtOrderForm'" [class.viewer-mode]="isViewerMode"></app-crrt-order-form>
      <app-picco-record *ngIf="selectedFormKey === 'piccoForm'" [class.viewer-mode]="isViewerMode"></app-picco-record>
      <app-iabp-record *ngIf="selectedFormKey === 'iabpForm'" [class.viewer-mode]="isViewerMode"></app-iabp-record>
      <app-tolerance-score *ngIf="selectedFormKey === 'toleranceForm'" [class.viewer-mode]="isViewerMode"></app-tolerance-score>
      <app-commit-suicide-score *ngIf="selectedFormKey === 'commitSuicideForm'" [class.viewer-mode]="isViewerMode"></app-commit-suicide-score>
      <app-iad-score *ngIf="selectedFormKey === 'IADForm'" [class.viewer-mode]="isViewerMode"></app-iad-score>
      <app-baethei-score *ngIf="selectedFormKey === 'baetheiForm'" [class.viewer-mode]="isViewerMode"></app-baethei-score>
      <app-patient-fall-danger *ngIf="selectedFormKey === 'patientFallDangerForm'" [class.viewer-mode]="isViewerMode"></app-patient-fall-danger>
      <app-braden-form *ngIf="selectedFormKey === 'bradenForm'" [class.viewer-mode]="isViewerMode"></app-braden-form>
      <app-unplanned-extubation *ngIf="selectedFormKey === 'unPlannedCGZYYForm'" [class.viewer-mode]="isViewerMode"></app-unplanned-extubation>
      <app-health-education *ngIf="selectedFormKey === 'jkjyForm'" [class.viewer-mode]="isViewerMode"></app-health-education>
      <app-wpgm-form *ngIf="selectedFormKey === 'wpgmForm'" [class.viewer-mode]="isViewerMode"></app-wpgm-form>
    </div>
  </div>
</div>
